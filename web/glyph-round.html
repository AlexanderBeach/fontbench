<title>Glyph Round</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#ececeb; --panel:#fbfbfa; --ink:#191b1e; --dim:#63686e; --rule:#d3d4d2;
  --accent:#2f6072; --warm:#8a5a35; --paper:#ffffff; --shadow:rgba(20,22,26,.13);
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tile:1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --panel:#1a1c1f; --ink:#e7e8e6; --dim:#9aa0a6; --rule:#2e3136;
    --accent:#7fb6c9; --warm:#c99a63; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --panel:#1a1c1f; --ink:#e7e8e6; --dim:#9aa0a6; --rule:#2e3136;
  --accent:#7fb6c9; --warm:#c99a63; --shadow:rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap}
.mark{font-weight:600;letter-spacing:-.01em;margin-right:2px}
.mark span{color:var(--dim);font-weight:400}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:none;border:1px solid transparent;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--dim)}
nav button[aria-current="true"]{color:var(--ink);border-color:var(--rule);background:var(--bg)}
nav button:hover{color:var(--ink)}
.meter{height:2px;background:var(--rule)}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
main{max-width:1180px;margin:0 auto;padding-block:22px 132px;padding-inline:16px}
.view{display:none}
.view.on{display:block}
.prompt{margin:0 0 4px;font-size:19px;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0 0 20px;color:var(--dim);font-size:14px;max-width:70ch}
.round{margin:0 0 6px;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
/* Every tile draws its glyph at the same magnification of the specimen's own
   units, in which all families already share one x-height. So a tall glyph is
   tall because the family drew it tall. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(104px * var(--tile)),1fr));gap:10px}
.tile{background:var(--paper);border:2px solid transparent;border-radius:6px;padding:6px;cursor:pointer;box-shadow:0 1px 2px var(--shadow);position:relative}
.tile:hover{border-color:var(--rule)}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.tile svg{display:block;width:100%;height:auto;fill:#191b1e}
.tile .n{position:absolute;left:6px;top:4px;font-size:11px;color:var(--dim)}
.tile .name{display:block;margin-top:4px;font-size:12px;color:var(--dim);text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dockin{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock .count{color:var(--dim);font-size:13px;margin-right:auto}
.dock button{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 14px;cursor:pointer}
.dock button:hover{border-color:var(--accent)}
.dock button.go{background:var(--accent);border-color:var(--accent);color:#fff}
.dock button:disabled{opacity:.5;cursor:default}
.dock kbd{font:inherit;font-size:12px;color:var(--dim);border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin-left:6px}
select{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer;color:inherit;font:inherit}
label.sw{display:inline-flex;gap:6px;align-items:center;color:var(--dim);font-size:13px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rankbar{display:block;height:4px;background:var(--accent);border-radius:2px;margin-top:5px}
.note{color:var(--dim);font-size:13.5px;max-width:70ch}
.brief{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-top:22px}
.brief h3{margin:0 0 10px;font-size:15px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.pick{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.pick h4{margin:0 0 8px;font-size:14px}
.pick .row{display:flex;gap:8px}
.pick .row .tile{cursor:default;flex:1}
.empty{color:var(--dim);padding:30px 0;max-width:60ch}
.mini{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="bar">
    <div class="mark">Glyph round <span id="cohort">— loading</span></div>
    <label class="sw">Size
      <select id="tile"><option value="1">Small</option><option value="1.5">Medium</option><option value="2">Large</option></select>
    </label>
    <nav>
      <button id="nav-pick" aria-current="true">Pick</button>
      <button id="nav-results">Results</button>
    </nav>
  </div>
  <div class="meter"><i id="meter"></i></div>
</header>

<main>
  <section id="v-pick" class="view on"><div id="pick-body"></div></section>
  <section id="v-results" class="view"><div id="res-body"></div></section>
</main>
<div class="dock" id="dock"><div class="dockin" id="dockin"></div></div>

<script>
"use strict";
const FONTS = __FONTS__;
const GLYPHS = __GLYPHS__;   // family key -> glyph name -> outline markup, from the character-detail specimens

/* One screen per glyph. Every family that has the glyph is shown, blind and
   shuffled, and you mark up to three you like. Categories group the results. */
const SCREENS = [
  ["Q", "Latin capitals", "The tail is the most personal stroke in the alphabet."],
  ["R", "Latin capitals", "Straight leg, curved leg, or a flourish."],
  ["G", "Latin capitals", "With or without a spur, and how the bowl closes."],
  ["K", "Latin capitals", "Whether the arms meet the stem or each other."],
  ["W", "Latin capitals", "Crossed middle strokes or a single apex."],
  ["a", "Lowercase", "The bowl, and how far the top curls back."],
  ["g", "Lowercase", "Two storeys or one, and the ear."],
  ["e", "Lowercase", "The angle of the bar and the size of the eye."],
  ["k", "Lowercase", "Whether the arm and leg meet at the stem."],
  ["y", "Lowercase", "The tail, and whether the strokes meet at a point."],
  ["f", "Lowercase", "The hook and its overhang."],
  ["t", "Lowercase", "Height of the ascender above the bar."],
  ["1", "Figures", "Flag, base, or neither."],
  ["3", "Figures", "Flat or round top."],
  ["7", "Figures", "Straight or curved stem, and its angle."],
  ["a italic", "Italic", "Whether the italic a is one storey and how far it slopes."],
  ["e italic", "Italic", "The italic e, often the most calligraphic letter."],
  ["k italic", "Italic", "Looped or straight."],
  ["f italic", "Italic", "Whether the italic f descends below the line."],
  ["x italic", "Italic", "The letter every variable is set in."],
  ["g bold", "Bold", "How the bold keeps the shape of the regular."],
  ["e bold", "Bold", "Whether the eye stays open in bold."],
  ["B bold", "Bold", "Weight without loss of the counters."],
  ["& misc", "Symbols", "The ampersand, the second most personal glyph."],
  ["α", "Greek", "The loop and the tail."],
  ["θ", "Greek", "Bar through or across the bowl."],
  ["φ", "Greek", "Open or closed loop."],
  ["ξ", "Greek", "The hardest Greek letter to draw well."],
  ["π", "Greek", "Straight or curved legs."],
  ["Σ", "Greek", "As a letter, not the operator."],
  ["Ω", "Greek", "The feet and the opening."],
  ["ℝ", "Alphabets", "Blackboard bold: doubled stroke or hollow."],
  ["𝒜", "Alphabets", "Calligraphic A."],
  ["∫", "Operators", "Weight and slope of the integral sign."],
  ["∑", "Operators", "The summation sign at text size."],
  ["∂", "Operators", "The partial: how it relates to the italic d."],
  ["∞", "Operators", "Open or closed loops, and stroke contrast."],
  ["≤", "Relations", "Angle of the arrowhead and the bar below."],
  ["→", "Relations", "Arrowhead shape and stem weight."],
  ["∈", "Relations", "Open or closed, and the bar."]
];
const MAX_PICKS = 3;
const MAG = 8;                        // CSS px per specimen unit (a PostScript point at the specimen's size)
const BOX_TOP = -10.5, BOX_H = 14, BOX_W = 13;   // tile window in specimen units, baseline at 0
const STORE = "glyph.v1", TILE_STORE = "glyph.tile";

const BLANK = () => ({version:1, order:{}, picks:{}});   // order: glyph -> shuffled family keys, picks: glyph -> [keys]
let S = BLANK(), view = "pick", screen = 0;
const byKey = k => FONTS.find(f => f.key === k);
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const p = JSON.parse(localStorage.getItem(STORE) || "null");
    if(p && p.version === 1 && p.order && p.picks) S = p;
    const t = localStorage.getItem(TILE_STORE);
    if(t){ document.getElementById("tile").value = t; document.documentElement.style.setProperty("--tile", t); }
  }catch(e){}
}
function families(glyph){ return FONTS.map(f => f.key).filter(k => GLYPHS[k] && GLYPHS[k][glyph]); }
function orderFor(glyph){
  if(!S.order[glyph]){
    const keys = families(glyph);
    for(let i = keys.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
    S.order[glyph] = keys; save();
  }
  return S.order[glyph];
}
function tileMarkup(key, glyph){
  return '<svg viewBox="0 ' + BOX_TOP + ' ' + BOX_W + ' ' + BOX_H + '" xmlns="http://www.w3.org/2000/svg"><g class="g">' + GLYPHS[key][glyph] + '</g></svg>';
}
function centre(svg){                 // slide the window so the glyph sits in the middle of the tile
  const g = svg.querySelector(".g");
  let b; try{ b = g.getBBox(); }catch(e){ return; }
  const cx = b.x + b.width / 2;
  svg.setAttribute("viewBox", (cx - BOX_W / 2).toFixed(2) + " " + BOX_TOP + " " + BOX_W + " " + BOX_H);
}
function done(){ return SCREENS.filter(s => S.picks[s[0]]).length; }
function firstUnpicked(){ const i = SCREENS.findIndex(s => !S.picks[s[0]]); return i < 0 ? SCREENS.length : i; }

function boot(){
  load();
  screen = firstUnpicked();
  document.getElementById("cohort").textContent = "— " + FONTS.length + " families, " + SCREENS.length + " glyphs";
  const t = document.getElementById("tile");
  t.onchange = () => { document.documentElement.style.setProperty("--tile", t.value); try{ localStorage.setItem(TILE_STORE, t.value); }catch(e){} };
  paint();
}
function paint(){
  document.getElementById("meter").style.width = (100 * done() / SCREENS.length) + "%";
  if(view === "pick") paintPick(); else paintResults();
  paintDock();
}
function paintPick(){
  const host = document.getElementById("pick-body");
  if(screen >= SCREENS.length){
    host.innerHTML = '<h2 class="prompt">All glyphs seen</h2><p class="sub">' + done() + ' of ' + SCREENS.length + ' glyphs have picks. The Results tab names them.</p>';
    return;
  }
  const [glyph, cat, hint] = SCREENS[screen], keys = orderFor(glyph), picks = S.picks[glyph] || [];
  host.innerHTML = '<p class="round">' + cat + ' · glyph ' + (screen + 1) + ' of ' + SCREENS.length + '</p>' +
    '<h2 class="prompt">' + glyph.replace(/ (misc|italic|bold)$/, " $1").replace(" misc", "") + '</h2>' +
    '<p class="sub">' + hint + ' Mark up to ' + MAX_PICKS + ' you like, then Next. Skip if none appeal.</p>' +
    '<div class="grid">' + keys.map((k, i) => '<button class="tile" data-k="' + k + '" aria-pressed="' + picks.includes(k) + '"><span class="n">' + (i + 1) + '</span>' + tileMarkup(k, glyph) + '</button>').join("") + '</div>';
  host.querySelectorAll(".tile svg").forEach(centre);
  host.querySelectorAll(".tile").forEach(b => b.onclick = () => {
    let p = S.picks[glyph] ? S.picks[glyph].slice() : [];
    if(p.includes(b.dataset.k)) p = p.filter(x => x !== b.dataset.k);
    else if(p.length < MAX_PICKS) p.push(b.dataset.k);
    else return;
    S.picks[glyph] = p; save(); paintPick(); paintDock();
  });
}
function next(){ if(screen < SCREENS.length){ const g = SCREENS[screen][0]; if(!S.picks[g]) S.picks[g] = []; save(); screen++; paint(); } }
function paintDock(){
  const d = document.getElementById("dockin");
  if(view === "pick" && screen < SCREENS.length){
    const g = SCREENS[screen][0], n = (S.picks[g] || []).length;
    d.innerHTML = '<span class="count">' + n + ' of ' + MAX_PICKS + ' marked · ' + done() + ' of ' + SCREENS.length + ' glyphs done</span>' +
      (screen > 0 ? '<button id="d-prev">Back</button>' : "") +
      '<button class="go" id="d-next">' + (n ? "Next" : "Skip") + '<kbd>Enter</kbd></button>';
    const p = d.querySelector("#d-prev"); if(p) p.onclick = () => { screen--; paint(); };
    d.querySelector("#d-next").onclick = next;
  }else if(view === "pick"){
    d.innerHTML = '<span class="count">' + done() + ' glyphs done</span><button class="go" id="d-res">See results</button>';
    d.querySelector("#d-res").onclick = () => go("results");
  }else{
    d.innerHTML = '<span class="count">' + done() + ' of ' + SCREENS.length + ' glyphs done</span><button id="d-back">Back to picking</button><button id="d-reset">Start over</button>';
    d.querySelector("#d-back").onclick = () => { screen = firstUnpicked(); go("pick"); };
    d.querySelector("#d-reset").onclick = () => { if(confirm("Discard all picks and start over?")){ S = BLANK(); save(); screen = 0; go("pick"); } };
  }
}
function paintResults(){
  const host = document.getElementById("res-body");
  const picked = SCREENS.filter(s => (S.picks[s[0]] || []).length);
  if(!picked.length){ host.innerHTML = '<h2 class="prompt">Nothing picked yet</h2><p class="empty">Mark some glyphs and the tally will build here.</p>'; return; }
  const cats = [...new Set(SCREENS.map(s => s[1]))];
  const tally = {}, byCat = {};
  FONTS.forEach(f => { tally[f.key] = 0; byCat[f.key] = {}; cats.forEach(c => byCat[f.key][c] = 0); });
  SCREENS.forEach(([g, c]) => (S.picks[g] || []).forEach(k => { tally[k]++; byCat[k][c]++; }));
  const r = FONTS.map(f => f.key).sort((a, b) => tally[b] - tally[a] || a.localeCompare(b));
  const top = tally[r[0]] || 1;
  let html = '<h2 class="prompt">Picks by family</h2><p class="sub">' + picked.length + ' glyphs with picks, up to ' + MAX_PICKS + ' families each. ' +
    'The columns split the picks by category. A family that leads one column and trails another is a borrowing, not a default.</p>' +
    '<div style="overflow-x:auto"><table><tr><th>Family</th><th class="num">Picks</th>' + cats.map(c => '<th class="num">' + c + '</th>').join("") + '</tr>' +
    r.map((k, i) => '<tr><td><strong>' + (i + 1) + '. ' + byKey(k).label + '</strong><span class="rankbar" style="width:' + Math.max(3, 100 * tally[k] / top) + '%"></span></td>' +
      '<td class="num">' + tally[k] + '</td>' + cats.map(c => '<td class="num">' + (byCat[k][c] || "·") + '</td>').join("") + '</tr>').join("") + '</table></div>' +
    '<h3 style="margin-top:28px;font-size:15px">The picks, glyph by glyph</h3><p class="note">Names revealed. This list is the brief: which family drew each part the way you like it.</p>' +
    '<div class="picks">' + picked.map(([g, c]) => '<div class="pick"><h4>' + g.replace(" misc", "") + ' <span class="note">' + c + '</span></h4><div class="row">' +
      S.picks[g].map(k => '<div class="tile" data-k="' + k + '">' + tileMarkup(k, g) + '<span class="name">' + byKey(k).label + '</span></div>').join("") + '</div></div>').join("") + '</div>' +
    '<div style="margin-top:20px"><button class="mini" id="copy">Copy results as text</button></div>';
  host.innerHTML = html;
  host.querySelectorAll(".tile svg").forEach(centre);
  document.getElementById("copy").onclick = async () => {
    const lines = ["Glyph round: " + picked.length + " of " + SCREENS.length + " glyphs, up to " + MAX_PICKS + " picks each", ""];
    r.forEach((k, i) => lines.push((i + 1) + ". " + byKey(k).label + "  " + tally[k] + "  [" + cats.map(c => c + " " + byCat[k][c]).join(", ") + "]"));
    lines.push("", "Picks:");
    picked.forEach(([g, c]) => lines.push("  " + g.replace(" misc", "") + " (" + c + "): " + S.picks[g].map(k => byKey(k).label).join(", ")));
    try{ await navigator.clipboard.writeText(lines.join("\n")); document.getElementById("copy").textContent = "Copied"; }catch(e){}
  };
}
function go(v){
  view = v;
  ["pick", "results"].forEach(k => {
    document.getElementById("v-" + k).classList.toggle("on", k === v);
    document.getElementById("nav-" + k).setAttribute("aria-current", String(k === v));
  });
  paint(); window.scrollTo(0, 0);
}
document.getElementById("nav-pick").onclick = () => go("pick");
document.getElementById("nav-results").onclick = () => go("results");
document.addEventListener("keydown", e => {
  if(view !== "pick" || e.target.tagName === "SELECT") return;
  if(e.key === "Enter"){ e.preventDefault(); next(); }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 9){ const b = document.querySelectorAll("#pick-body .tile")[n - 1]; if(b) b.click(); }
});
boot();
</script>
